kind = "web"
previewPath = "/"
title = "地震監視モニター"
version = "1.0.0"
id = "artifacts/earthquake-monitor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22604

[services.development]
run = "pnpm --filter @workspace/jishinwatch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jishinwatch", "run", "build" ]
publicDir = "artifacts/JishinWatch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22604"
BASE_PATH = "/"
